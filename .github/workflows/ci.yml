name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Gate every other job: if this PR is a draft, skip CI entirely.
  # Pushes to main and non-draft PRs run normally.
  guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: baremetal-runners
    steps:
      - run: echo "Not a draft PR — running CI."

  rubocop:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rubocop
        run: bin/rubocop --format github
  brakeman:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman
  eslint:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: npm
        run: npm ci
      - name: lint
        run: npm run lint
  stylelint:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: npm
        run: npm ci
      - name: stylelint
        run: npx stylelint "app/javascript/**/*.scss"
  erb-lint:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: erb-lint
        run: bin/erb_lint --lint-all
  jest:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: npm
        run: npm ci
      - name: test
        run: npm test -- --coverage
      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest_coverage
          path: coverage/js/lcov.info
  prettier:
    needs: guard
    runs-on: baremetal-runners
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: npm
        run: npm ci
      - name: prettier
        run: bin/prettier --check
  assets-precompile:
    needs: guard
    runs-on: baremetal-runners

    env:
      RAILS_ENV: production
      HEROKU_APP_NAME: dummy
      REDIS_URL: dummy
      SECRET_KEY_BASE: dummy

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: install required apt packages
        run: sudo apt-get -y install libpq-dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: bundle install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: npm
        run: npm ci
      - name: run bin/rails assets:precompile
        run: bin/rails assets:precompile

  rspec:
    needs: guard
    runs-on: baremetal-runners

    env:
      RAILS_ENV: test

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - name: bundle install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: npm
        run: npm ci
      - name: run bin/shakapacker
        run: bin/shakapacker
      - name: rspec
        run: bundle exec rspec
      - name: Upload RSpec coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec_coverage
          path: coverage/coverage.json
      - name: Archive capybara artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara
          path: tmp/capybara/

  # Fire-and-forget: hand the analysis off to the Sonar workflow (sonar.yml)
  # and finish. Sonar is not a blocking gate, so it should not hold CI's status
  # open for the length of the scan, or fail CI when its server is down.
  trigger-sonar:
    needs: [rspec, jest]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Sonar analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run sonar.yml \
            --ref "$GITHUB_REF_NAME" \
            -f ci_run_id="$GITHUB_RUN_ID" \
            -f sha="$GITHUB_SHA"
